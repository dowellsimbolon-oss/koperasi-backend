<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koperasi Karyawan - PT. Theo Marhara Abadi</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTAINER LOGIN -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-university login-logo"></i>
                <h2>Koperasi Karyawan</h2>
                <p>PT. Theo Marhara Abadi</p>
            </div>

            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="nik"><i class="fas fa-id-card"></i> Username / Nomor Anggota</label>
                    <input type="text" id="nik" placeholder="Masukkan NIK (contoh: 123456)" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Masukkan kata sandi" required>
                </div>

                <button type="submit" class="btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>

            <div class="login-footer"></div>
        </div>
    </div>

    <!-- ==================== APLIKASI UTAMA ==================== -->
    <div id="appContainer" class="app-container hidden">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-university"></i> Koperasi Karyawan
            </div>
        </nav>
        <main class="main-content">
            <h2>Selamat Datang di Aplikasi Utama</h2>
        </main>
    </div>

    <!-- Script JavaScript -->
    <script src="script.js"></script>
</body>
</html>
